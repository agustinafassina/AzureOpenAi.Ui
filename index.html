<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <title>Chat with GPT</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <body>

  <h2>Chat with GPT <i class="fa-regular fa-user"></i></h2>
  <div id="chatBox"></div>

  <div id="inputContainer">
    <input type="text" id="userInput" placeholder="Type your message..." />
    <button id="sendBtn" onclick="enviarMensaje()">
      Send <i class="fa-solid fa-pen-to-square"></i>
    </button>
  </div>

  <script>
  const apiUrl = "http://localhost:5142/api/v1/Chat";

  // Builds the message with textContent so user or model text is never parsed as HTML (prevents XSS).
  function appendMessage(author, text, type) {
    const chatBox = document.getElementById("chatBox");
    const row = document.createElement("div");
    row.style.marginBottom = "8px";

    if (type === "error") {
      row.style.color = "red";
      row.textContent = `Error: ${text}`;
    } else if (type === "typing") {
      row.style.cssText = "margin-bottom: 8px; color: #888; font-style: italic;";
      row.textContent = text;
    } else {
      if (type === "user") row.style.textAlign = "right";
      const bubble = document.createElement("div");
      bubble.style.cssText = `display: inline-block; padding: 8px; border-radius: 8px; white-space: pre-wrap; background: ${type === "user" ? "#DCF8C6" : "#E5E5EA"};`;
      const label = document.createElement("strong");
      label.textContent = `${author}:`;
      bubble.append(label, " ", text);
      row.appendChild(bubble);
    }

    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
    return row;
  }

  async function enviarMensaje() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const message = input.value.trim();
    if (!message || sendBtn.disabled) return;

    input.value = "";
    appendMessage("Tu", message, "user");

    sendBtn.disabled = true;
    const typingRow = appendMessage("", "GPT está escribiendo...", "typing");

    try {
      const response = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });
      if (!response.ok) {
        throw new Error(`The API responded with ${response.status} ${response.statusText}`.trim());
      }
      const data = await response.json();
      if (typeof data.reply !== "string") {
        throw new Error("The API response does not include a 'reply' field.");
      }

      appendMessage("GPT", data.reply, "bot");
    } catch (error) {
      appendMessage("", error.message, "error");
    } finally {
      typingRow.remove();
      sendBtn.disabled = false;
      input.focus();
    }
  }

  document.getElementById("userInput").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.isComposing) {
      event.preventDefault();
      enviarMensaje();
    }
  });
  </script>

  </body>
</html>
